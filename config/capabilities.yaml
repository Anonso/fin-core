    输出始终保持 advisory-only，不产生交易副作用；Hermes 用户咨询统一经 consultation.decision_support 组合
    G/Z/PAPER 后展示。

    '
  intent_examples:
  - 我现在这些持仓最该先处理什么
  - 盛和资源和北方稀土哪个更值得看
  - 继续刚才的研究并补充风险条件
  - 读取上一次决策指导的最新版本
  - 这条建议方向错了
