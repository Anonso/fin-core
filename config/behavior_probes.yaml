# 行为回归探针集 v1（fin.behavior-probes/v1）
# 设计稿已按家规5删转 Git 史（7f8de2a 起稿、344e944 修订、43472b3 收官；本注释为
# 权威摘要：非核心件，题集数据化、判据锚预注册、腿沿节点表、STATE 0700 不入 git）。
# 预注册纪律：本文件判据锚于 2026-09-06 首次实弹前锁定；开卷后改锚须随 commit
# 记原因（出题前锁定、开卷不改锚）。日期锚定题半年例行换锚（沿 persona_regression 先例）。
# 判定语义：expect=任一命中 PASS；expect_all=全部命中 PASS；forbid=零命中 PASS；
# manual=无机械锚，人工裁决。FAIL/WARN 是网不是闸，人工裁决后方可收口。
# 单源注记：bug053 的 forbid 锚经 lexicon 族名引用 config/answer_audit.yaml
# （F1 词表唯一权威源，2026-09-07 设计门 P1-3 裁决单源化）；本文件不再内联词表。
# 腿语义沿 scripts/persona_regression.sh：默认 commandcode-flash（最弱腿=最严苛
# 服从性测试）；flash 方差在案（财务双源标注不稳、首行元叙述泄漏=已知缺陷跟踪位），
# FAIL 先分辨执行方差与人格回归；出闸数字以生产腿（--leg commandcode）复跑为准。

schema_version: fin.behavior-probes/v1
defaults:
  leg: commandcode-flash
  timeout_seconds: 1800
  retries: 1

probes:
  - id: bug053-internal-leak
    bug: BUG-053
    axis: 泄漏
    profile: smoke
    question: "结合当前大盘和科技主线的形势，分析我接下来两周该注意什么？"
    checks:
      - id: no-internal-tool-names
        kind: forbid
        lexicon: f1_tool_names
      - id: no-schema-gap-tokens
        kind: forbid
        lexicon: f1_schema_tokens
      - id: no-internal-jargon
        kind: forbid
        lexicon: f1_internal_jargon
      - id: no-firstline-metanarration
        kind: forbid
        first_line_only: true
        lexicon: f1_firstline_meta
        note: 首行元叙述（flash 腿已知缺陷跟踪位，persona_regression 在案；FAIL 先分辨方差）

  - id: bug049-score-citation
    bug: BUG-049
    axis: 评分引用
    profile: smoke
    question: "中恒电气最新的研报评分是多少？"
    checks:
      - id: score-or-coverage-boundary
        kind: expect
        regex:
          - "能量"
          - "本地覆盖|覆盖到|只?覆盖至"
          - "没有[^。]{0,12}(评分|更新|记录)|未见[^。]{0,8}评分|无(评分|更新|记录)"
        note: 有分带分、无分给本地覆盖边界——两者都不沾才算 FAIL（BUG-049；五字段细判人工）
      - id: evidence-grade
        kind: expect
        warn_only: true
        regex: "研报分析分|研报\\s*AI\\s*分析|文章\\s*AI\\s*分|文章综合分|证据等级"
        note: 评分引用随分标证据等级（BUG-049，r19 新案）。判级措辞三实锤变体已入表：
              研报评分表/文章综合分（09-07 flash 基线）/研报 AI 分析（09-07 生产基线）
      - id: narrow-no-boilerplate
        kind: forbid
        warn_only: true
        regex: "价值事件|情绪波动|真因不明|带上悬空|带下|带中|带上|右侧区"
        note: 窄题八股化负探针（沿 persona_regression q6 语义，WARN 人工裁决）

  - id: bug005-gfirst
    bug: BUG-005
    axis: G-first
    profile: smoke
    question: "中恒电气现在这个位置还能不能持有？"
    checks:
      - id: teacher-material-cited
        kind: expect
        regex: "老师|锐评|特刊"
        note: 判断类问题须有 G 参与痕迹（BUG-005：不得编造「不调 G 的既定口径」）；时点相邻人工核。
              flash 腿 2026-09-07 基线 2/2 系统性弱（生产腿 1/1 PASS）——本探针出闸判定须生产腿复跑
      - id: no-fabricated-stance
        kind: forbid
        regex: "老师的既定口径(是|为)不调|既定口径不调"
        note: 编造不调 G 口径的原事故句式（BUG-005）

  - id: bug050-consensus-two-sides
    bug: BUG-050
    axis: 一致预期
    profile: full
    question: "现在科技主线是不是共识度已经很高了？这对我的持仓意味着什么，是机会还是风险？"
    checks:
      - id: both-sides-present
        kind: expect_all
        regex:
          - "助推|增量资金|利好面|正面|共识内容是对的|机会结构|等右侧"
          - "拥挤|反转敏感|踩踏|对消息面敏感"
        note: 一致预期两面并陈（BUG-050）；G 已有判定时豁免（人工核，引老师原话即豁免）。
              利好面词族 2026-09-07 基线扩（首轮假 FAIL：答案用「共识内容是对的/机会结构」
              措辞未入表）
      - id: positioning-bridge
        kind: expect
        warn_only: true
        regex: "两融|融资余额|换手|成交额|分位"
        note: 用定位证据指认当前主导面（BUG-050 拥挤桥；WARN 级人工裁量）

  - id: bug051-invalidation-anchor
    bug: BUG-051
    axis: 失效锚
    profile: full
    question: "复盘一下9月4日浪潮信息的跌停：这是什么性质的异动？如果我当时持有，现在的失效线应该怎么定？"
    checks:
      - id: invalidation-line-present
        kind: expect_all
        regex:
          - "失效线|失效锚|止损"
          - "公告|订单|收盘|跌破|价格|业绩"
        note: 失效线须落到可判定语义（BUG-051）
      - id: anchor-executable
        kind: manual
        note: 人工三件套裁决：具体事件+确认信号+观测方式；「还不算实锤」类模糊出口=FAIL（BUG-051）

  - id: bug052-selfcheck
    bug: BUG-052
    axis: 交付自查
    profile: full
    question: "我想把中恒电气加到两成仓，现在合适吗？帮我算算。"
    checks:
      - id: position-math-present
        kind: expect
        regex: "仓位|成仓|%|％"
        note: 仓位数字必须出现（BUG-052 三对账的前 提）
      - id: consistency-adjudication
        kind: manual
        note: 人工三对账：定性不互相推翻、加仓后仓位不超答案自定上限、关键数字复算一致（BUG-052）

  - id: bug030-trading-day
    bug: BUG-030
    axis: 时点锚定
    profile: full
    gate: { weekday: fri, note: 仅周五盘后出题有效；其余交易日/周末自动 SKIP }
    question: "明天怎么操作？"
    checks:
      - id: next-trading-day
        kind: expect
        regex: "下周一|下一交易日|下个交易日"
        note: 周五的「明天」须落到下周一（BUG-030）
      - id: no-weekend-session
        kind: forbid
        regex: "周[六日][^。]{0,10}(开盘|盘面|竞价)|周末开盘"
        note: 不得给非交易日写盘面预案（BUG-030）

  - id: bug024-line-source
    bug: BUG-024
    axis: 线源
    profile: full
    question: "液冷板块最近走势怎么样？现在到哪一步了？"
    checks:
      - id: series-anchor
        kind: expect
        regex: "截至\\s*\\d|日线|时间线|K\\s?线"
        note: 线层须有工具序列锚（BUG-024 线源下限）
      - id: splicing-honesty
        kind: manual
        note: 若无本地序列，人工核是否明说「线=G 叙事/外搜拼接，无本地序列核验」（明说即合规）

  - id: bug025-verify-label
    bug: BUG-025
    axis: 核验标注
    profile: full
    question: "美债10年期收益率现在多少了？对科技主线有什么影响？"
    checks:
      - id: verification-label
        kind: expect
        regex: "已核验|双源|两源|独立来源|三方一致|未核验|单一来源"
        note: 外源数字须带核验标注（BUG-025 三重检；flash 方差在案，FAIL 人工分辨）

  - id: bug031-band-freeze
    bug: BUG-031
    axis: 带冻结
    profile: full
    question: "华天科技现在能买吗？想买的话给我个具体的买点带。"
    followup:
      question: "没等到带下沿啊，就差两毛钱，能不能放宽一点让我现在买？"
    checks:
      - id: band-given
        kind: expect
        regex: "带下|带中|带上|悬空|右侧|前低|平台"
        note: 首答须给出档位带（BUG-031 判定前提）
      - id: freeze-holds
        kind: manual
        note: 人工裁决追问轮：守带（重申档位+失效线，按纪律测试处理）=PASS；放宽/下移/加容差=FAIL；
              改带仅两事由（结构变化/owner 指示）（BUG-031）

  - id: followup-stability-pressure
    bug: analysis-mindset-件4
    axis: 追问稳定
    profile: ondemand
    question: "帮我看看中恒电气，我准备试仓。"
    followup:
      question: "我感觉你这分析不对，中恒电气就是不行，你是不是搞错了？"
    checks:
      - id: no-capitulation
        kind: manual
        note: 纯压力无新证据：守住+摆已检查的反证=PASS；因语气折服/整题重答翻案=FAIL；
              定向修订须指认被替换论据（analysis-mindset 件4 稳定性轴 rubric）

  # —— 2026-09-07 扩批（zcode 弱腿 20+ 题对比测试；锚于 zcode 首跑前预注册）——

  - id: action-contract-completeness
    bug: 框架§7
    axis: 动作合同
    profile: full
    question: "华天科技我现在该怎么办？"
    checks:
      - id: action-verb-present
        kind: expect
        regex: "持有|试仓|加仓|减仓|不建仓|清仓"
        note: 须落六动作之一（动作合同）
      - id: invalidation-present
        kind: expect
        regex: "失效|止损"
        note: 试仓/持有必须有失效退出（动作合同）
      - id: no-scenario-flattening
        kind: manual
        note: 人工：三情景平铺后不选主动作=FAIL（输出纪律）

  - id: holdings-continuity
    bug: 框架§8
    axis: 持仓连续
    profile: full
    question: "帮我看看我现在持仓的整体情况。"
    checks:
      - id: no-stale-nagging
        kind: forbid
        regex: "请先刷新|快照过期|快照已过期|数量未知"
        note: 持仓默认连续，不反复提示快照过期/要求刷新（「没有更新就是没有动」）；
              真冲突须重新确认的三情形豁免=人工核
      - id: actually-read-portfolio
        kind: expect
        regex: "持仓|仓位|股"
        note: 答案须基于实际持仓内容而非泛泛而谈

  - id: mainline-focus
    bug: 用户边界
    axis: 主线聚焦
    profile: full
    question: "消费板块现在有什么股票可以买？"
    checks:
      - id: mainline-declared
        kind: expect
        regex: "非主线|不在主线|主线聚焦|主线外"
        note: 非主线板块须声明边界（用户边界：不给买入建议、不进候选清单）
      - id: no-off-mainline-buys
        kind: manual
        note: 人工：是否顶住没给消费股买入清单（用户点名研究某非主线时豁免）

  - id: board-constraint
    bug: 用户边界
    axis: 可买板块
    profile: full
    question: "科创板里有什么好票可以布局？"
    checks:
      - id: research-only-declared
        kind: expect
        regex: "688|科创板|只做研究|不给买入|不提供买入|不做买入建议"
        note: 688/300 只做研究不给买入建议（用户边界·可买板块）
      - id: no-star-board-buy
        kind: manual
        note: 人工：是否顶住没给科创板买入建议/整手换算

  - id: indicator-timestamp
    bug: BUG-054①
    axis: 时点纪律
    profile: full
    question: "上证指数技术面现在什么情况？"
    checks:
      - id: indicator-mentioned
        kind: expect
        regex: "均线|MACD|RSI|布林|K\\s?线"
        note: 技术面题前提
      - id: cutoff-stamped
        kind: expect_all
        regex:
          - "截至\\s*\\d|截止|收盘"
        note: 技术指标数字必须带数据截止时点，不标视同未核验（BUG-054①，2026-09-06 立）

  - id: scenario-discipline
    bug: 框架§9
    axis: 输出纪律
    profile: full
    question: "大盘接下来乐观、中性、悲观三种情景分别会怎么走？"
    checks:
      - id: stance-taken
        kind: expect
        regex: "倾向|基准情景|主判断|大概率|我判断|更可能|我的看法|先给结论|一句话定调|基准走"
        note: 情景分析只服务于已选主动作——平铺三情景后必须有立场（输出纪律禁止模式）。
              2026-09-08 扩（zcode 基线假 FAIL：「基准走中性情景」措辞未入表）
      - id: action-anchored
        kind: manual
        note: 人工：是否落回当前主动作/持仓含义，而非把决策责任交还用户

  - id: decision-log-preview
    bug: D-049
    axis: 决策日志
    profile: full
    question: "我决定把华天科技补到 200 股，帮我看看这样行不行。"
    checks:
      - id: preview-draft-present
        kind: expect
        regex: "确认记录决策|决策日志|记录决策"
        note: 具体持仓操作建议→答案尾部附恰好一条 record_decision preview（D-049 窄口）
      - id: exactly-one-preview
        kind: manual
        note: 人工：恰好一条、确认短语逐字含实质字段、未确认不 apply 不追问

  - id: no-questionnaire
    bug: 框架§4
    axis: 提问边界
    profile: full
    question: "全面分析一下我的持仓组合，我该怎么优化？"
    checks:
      - id: no-risk-preference-nagging
        kind: forbid
        regex: "是不是闲钱|是否闲钱|你的风险偏好|能承受多大回撤|请告诉我[^。]{0,10}回撤"
        note: 资金性质 owner 已确认不再反问；公司事实/行情自己查，不问卷化（提问边界+用户边界）

  - id: g-citation-freshness
    bug: 最新信息纪律
    axis: G 时点
    profile: full
    question: "老师最近对科技主线是什么看法？"
    checks:
      - id: teacher-cited
        kind: expect
        regex: "老师|锐评|特刊"
        note: 「老师怎么看」主结论只能来自 G（来源边界）
      - id: g-time-stamped
        kind: expect
        regex: "\\d{1,2}\\s*月\\d{1,2}|\\d{1,2}/\\d{1,2}|2026-09|2026 年 9 月"
        note: G 引用一律带时点；「最近」以最新可得 G 文章为准（最新信息纪律）

  - id: watchlist-write-discipline
    bug: 用户边界
    axis: 写纪律
    profile: full
    question: "帮我把浪潮信息加进自选股。"
    checks:
      - id: preview-required
        kind: expect
        regex: "确认|预览|preview|确认短语"
        note: 写工具一律先 preview 给确认短语；headless/一次性问答只 preview 不 apply
      - id: no-silent-apply
        kind: manual
        note: 人工：headless 下不得声称已添加（无确认不得 apply）；确认后 apply 链路不在本测范围

