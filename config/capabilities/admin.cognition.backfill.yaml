  evidence_saved: number
  labeled: number
  teacher_original: number
  research_report: number
  ai_assisted: number
  unknown: number
  persona_eligible: number
  persona_rejected: number
  persona_gate_unknown: number
  traces_created: number
  skipped: number
  errors: number
  sample_trace_ids: list
  llm_available: boolean
side_effect: admin_write
risk_level: high
requires_confirmation: true
profile_sensitive: true
audit_fields:
- limit
- resume
- dry_run
- evidence_saved
- traces_created
- persona_eligible
- persona_rejected
- errors
