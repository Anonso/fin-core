id: admin.cognition.backfill
name: 认知回填
category: admin
status: stable
visibility: internal
version: 1
summary: 从知识库 Markdown 回填 EvidenceItem 和 ReasoningTrace；管理工具，默认不进入运行时路由。
intent_examples:
- 回填认知数据
- 重跑认知回填
primary_entry:
  type: mcp
  name: backfill_cognition
