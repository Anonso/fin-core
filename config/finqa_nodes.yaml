# finqa-chain 问询链节点表(fin.finqa-nodes/v2 · 连接池分层)。
# v2(2026-09-06,设计 docs/design/llm-pool-layering.md 设计门过闸):节点=「连接
# 引用(conn_ref)+ 本层旋钮」——harness/模型/连接总开关在 L1 连接池
# config/llm.yaml models 段(harness 型条目,别名全局唯一);本表只管
# 消费顺序/本层 enabled/session/别名。传导语义:池 enabled=false ⇒ 链序跳过
# 该腿(fail-visible+横幅);钉腿(--node,含 -i)遇池禁=拒绝(rc=2)。
# 声明序=优先序(提取链 llm.yaml 语义);新增节点=加一行 conn_ref 引用。
# 秘钥不入本文件——各腿认证位置见池条目 auth_note。
# 起法基线 = scripts/finqa_chain.py launcher(唯一权威,2026-09-06 收口;
# 旧 bashrc finqa-* 函数已退役,只余 finqa-c/-cmd 过渡别名)。设计稿随合入归档。
# 旋钮:session: keep|discard(仅 commandcode;discard=无头 --no-session,交互式
# 报错)、effort=launcher 单点 max。
# 使用实况(owner 2026-09-06 定调):owner 真实问询=有头手动(终端 CC/Windows
# ZCode 连 WSL),无头链流量≈测试——生产链序仅 commandcode 一条,其余皆测试腿。
# 测试腿名册(flash 非生产;弱腿=服从性/回归探针用;--node 钉腿可达):
#   A zcode             = glm-5.3-flash(弱腿第一+人格回归探针钉腿,owner 2026-09-07 拍板;单旋钮锚定 flash,无逐次模型机制)
#   B commandcode-flash = ds-flash(弱腿第二,同日启用入链)
#   C claude(备用)      = glm-5.3-flash(CC --model 逐次指定,实测生效)
# 弱双腿测试(owner 2026-09-07 拍板)=A+B 并跑:zcode 与 commandcode-flash 两条
#   --node 钉腿各一发,用于执行方差分辨/对照评估;claude 不入弱双腿。
# 测试腿原则(owner 2026-09-05 拍板):flash 非生产、仅测试用,FAIL 先分辨
# 执行方差与人格回归。
schema_version: fin.finqa-nodes/v2
cmd_version_pin: "1.49.1"  # cmd 客户端版本钉单源;读方=codex_open.sh + persona_regression.sh
                           # (闭源客户端升级先落替补,读不到 fail-closed)
nodes:
  - id: commandcode       # Command Code + ds-pro——链序唯一生产腿
    conn_ref: commandcode-pro
    alias: cmd            # 短打别名(--node cmd 等效);tsv/横幅仍落规范 id
    enabled: true
  - id: codex             # codex CLI + opencode-go(休眠:池条目 codex-opencode enabled=false)
    conn_ref: codex-opencode
    enabled: true         # 恢复语义:只翻池条目 enabled 一处,本节点常态 true
  # —— 弱腿/测试腿(flash 非生产;声明序=弱腿优先序;--node 钉腿可达;出题自测/对照评估)——
  - id: zcode             # 弱腿第一:zcode 无头 glm-5.3-flash(单旋钮锚定;无 TUI 交互形态)
    conn_ref: zcode
    enabled: true         # owner 2026-09-07 拍板启用,位 cmd 弱腿前
  - id: commandcode-flash # 弱腿第二:同 commandcode 连接,仅换 ds-flash(owner 2026-09-07 启用入链)
    conn_ref: commandcode-flash
    enabled: true
    session: discard      # 测试/探针腿不留 cmd 会话档(不 resume;tsv=provenance)
  - id: claude             # 备用测试腿:CC 无头 glm-5.3-flash(--model 逐次指定)
    conn_ref: claude-cc-flash
    enabled: false
