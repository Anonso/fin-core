# finqa-chain 机器问询链节点表(fin.finqa-nodes/v2 · 连接池分层)。
# v2(2026-09-06,设计 docs/design/llm-pool-layering.md 设计门过闸):节点=「连接
# 引用(conn_ref)+ 本层旋钮」——harness/模型/连接总开关在 L1 连接池
# config/llm.yaml models 段(harness 型条目,别名全局唯一);本表只管
# 消费顺序/本层 enabled/session/别名。传导语义:池 enabled=false ⇒ 链序跳过
# 该腿(fail-visible+横幅);钉腿(--node,含 -i)遇池禁=拒绝(rc=2)。
# 声明序=优先序(提取链 llm.yaml 语义);新增节点=加一行 conn_ref 引用。
# 秘钥不入本文件——各腿认证位置见池条目 auth_note。
# 起法基线 = scripts/finqa_chain.py launcher(唯一权威,2026-09-06 收口;
# 旧 bashrc finqa-* 函数已退役,只余 finqa-c/-cmd 过渡别名)。设计稿随合入归档。
# 旋钮:session: keep|discard(仅 commandcode;discard=无头 --no-session,交互式
# 报错)、effort=launcher 单点 max。
# 测试腿原则(owner 2026-09-05 拍板):测试/探针用低一档模型——最弱腿=最严苛
# 服从性测试;flash 非生产、仅测试用,FAIL 先分辨执行方差与人格回归。
# GLM 腿 = zcode 无头(owner 2026-09-06 拍板:zcode 替代其他 harness 的无头
# GLM 用法——claude 腿退出问询链、评审替补同步换 zcode;harness 本体与
# codex-glm 资产保留不删,有头 CLI 不动)。zcode 模型=全局单旋钮
# (~/.zcode/cli/config.json),池条目 model 与其一致(precheck 防漂移)。
schema_version: fin.finqa-nodes/v2
cmd_version_pin: "1.49.1"  # cmd 客户端版本钉单源;读方=codex_open.sh + persona_regression.sh
                           # (闭源客户端升级先落替补,读不到 fail-closed)
nodes:
  - id: zcode             # zcode CLI 无头 + glm-5.3(coding-plan 渠道;替 claude 腿)
    conn_ref: zcode
    enabled: true
  - id: codex             # codex CLI + opencode-go(暂关:池条目 codex-opencode enabled=false)
    conn_ref: codex-opencode
    enabled: true         # 恢复语义:只翻池条目 enabled 一处,本节点常态 true
  - id: commandcode       # Command Code + ds-pro
    conn_ref: commandcode-pro
    alias: cmd            # 短打别名(--node cmd 等效);tsv/横幅仍落规范 id
    enabled: true
  # —— 测试腿(enabled:false 不入链序,仅 --node 钉腿可达;出题自测/对照评估)——
  - id: commandcode-flash # 同 commandcode 连接,仅换模型(池条目级别 model 区分)
    conn_ref: commandcode-flash
    enabled: false
    session: discard      # 测试/探针腿不留 cmd 会话档(不 resume;tsv=provenance);
                          # 人格回归探针 persona_regression.sh 亦走本腿
