# finqa-chain 机器问询链节点表(fin.finqa-nodes/v1)。
# 声明序 = 优先序(提取链 llm.yaml 语义);每节点独立 enabled;新增/删除/
# 排序/开关只改本文件(同 harness 加节点零代码)。秘钥不入本文件——各腿认证
# 维持各自现状(claude=CLAUDE_CODE_CONFIG_DIR、cmd=cmd login 账号会话、
# codex=auth.json + llm.env 环境键、zcode=llm.env GLM_API_KEY→ZHIPU_API_KEY),
# 起法基线 = scripts/finqa_chain.py launcher(唯一权威,2026-09-06 收口;
# 旧 bashrc finqa-* 函数已退役,只余 finqa-c/-cmd 过渡别名)。设计稿随合入归档。
# 旋钮:model(节点级)、session: keep|discard(仅 commandcode;discard=无头
# --no-session,交互式报错)、effort=launcher 单点 max。
# 测试腿原则(owner 2026-09-05 拍板):测试/探针用低一档模型——最弱腿=最严苛
# 服从性测试;flash 非生产、仅测试用,FAIL 先分辨执行方差与人格回归。
schema_version: fin.finqa-nodes/v1
cmd_version_pin: "1.49.1"  # cmd 客户端版本钉单源;读方=codex_open.sh + persona_regression.sh
                           # (闭源客户端升级先落替补,读不到 fail-closed)
nodes:
  - id: claude            # CC harness + glm-5.3
    harness: claude
    enabled: true
  - id: codex             # codex CLI + opencode-go(暂关)
    harness: codex
    enabled: false        # opencode-go 429 长期故障(owner 2026-09-05 拍板);
                          # 恢复翻 true 即回第二位,无其他改动
  - id: commandcode       # Command Code + ds-pro
    harness: commandcode
    alias: cmd            # 短打别名(--node cmd 等效);tsv/横幅仍落规范 id
    enabled: true
  # —— 测试腿(enabled:false 不入链序,仅 --node 钉腿可达;出题自测/对照评估,
  #    owner 2026-09-06 拍板:zcode·glm-5.3-flash 与 cmd·ds-flash,effort 均 max)——
  - id: zcode-flash       # zcode CLI 无头;模型/effort 单旋钮在 ~/.zcode/cli/config.json
    harness: zcode        # (precheck 校验节点 model 与其一致防漂移);无交互形态
    enabled: false
    model: zhipu/glm-5.3-flash
  - id: commandcode-flash # 同 commandcode harness,仅换模型(节点级 model 字段覆盖默认)
    harness: commandcode
    enabled: false
    model: deepseek/deepseek-v4-flash
    session: discard      # 测试/探针腿不留 cmd 会话档(不 resume;tsv=provenance);
                          # 人格回归探针 persona_regression.sh 亦走本腿
