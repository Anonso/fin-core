# LLM 能力映射（不保存 key 或 URL 实值）
# 实值统一来自 FIN_LLM_ENV_FILE 指向的 owner-only 环境文件。
# 拓扑投影=docs/architecture/llm-route-topology.md：改本表链序/增删条目须同步该页。

models:
  # GLM-5.3 (官方 bigmodel coding plan，CC 同款凭据) - 难题质量锚（T0）
  # owner 2026-09-03：coding-plan 额度恢复，复启用（D-028 暂关解除）
  glm53:
    provider: openai_compatible
    model: glm-5.3
    api_key: ${GLM_API_KEY}
    base_url: "https://open.bigmodel.cn/api/coding/paas/v4"
    enabled: true

  # GLM-5.3-Flash (官方 bigmodel coding plan，同款凭据) - 简单任务吞吐锚（T1）
  # owner 2026-09-03：coding-plan 额度恢复，复启用（D-028 暂关解除）
  glm53_flash:
    provider: openai_compatible
    model: glm-5.3-flash
    api_key: ${GLM_API_KEY}
    base_url: "https://open.bigmodel.cn/api/coding/paas/v4"
    enabled: true
    # 2026-09-07：思考 token 会吃光 max_tokens 致 content 为空（finish=length，
    # 实证 reasoning_content 2744 字符/1500tok），机械抽取任务关思考——
    # 空结果由 cognition 升级梯（同 backend 开思考重试）兜底。
    extra_body:
      thinking:
        type: disabled
    timeout: 600

  # 通义千问 Qwen3.6-35B (硅基流动 SiliconFlow)
  qwen:
    provider: openai_compatible
    model: Qwen/Qwen3.6-35B-A3B
    api_key: ${SILICONFLOW_API_KEY}
    base_url: ${SILICONFLOW_BASE_URL}
    enabled: true
    # 2026-09-07：同 flash——实测单篇抽取 reasoning 9462 字符撑爆 4096 预算。
    extra_body:
      enable_thinking: false
    timeout: 600

  # DeepSeek V4 Pro remains the legacy standalone backend for non-ZSXQ callers.
  deepseek:
    provider: openai_compatible
    model: deepseek-v4-pro
    api_key: ${DEEPSEEK_API_KEY}
    base_url: ${DEEPSEEK_BASE_URL}
    reasoning_effort: max
    enabled: true

  # DeepSeek V4 Flash —— 提取链 DS 槽位按 owner 设计拆两个独立链节点（每个
  # 节点 enabled 开关，声明序固定不挪动）：
  #   cognition 链 = glm53_flash → deepseek_flash_opencode → deepseek_flash_cmd
  #   → qwen。
  # deepseek_flash_opencode（opencode-go 429 长期故障曾于 owner 2026-09-05
  # 拍板禁用；owner 2026-09-07 复测渠道已恢复〔curl 与生产 OpenAI SDK 探针
  # /models+chat 均 200〕后令翻回 enabled，即回 DS 槽位第一位，无其他改动。
  # 前提：llm.env 的 OPENCODE_GO_* 与 auth.json 的 opencode-go 条目仍在位——
  # 若已清理，启用后节点会被 fail-visible 跳过（非静默），需先补 key）。
  deepseek_flash_opencode:
    provider: openai_compatible
    model: deepseek-v4-flash
    api_key: ${OPENCODE_GO_API_KEY}
    base_url: ${OPENCODE_GO_BASE_URL}
    endpoints:
      - name: opencode-primary
        api_key: ${OPENCODE_GO_API_KEY}
        base_url: ${OPENCODE_GO_BASE_URL}
      - name: opencode-authjson
        api_key: ${AUTHJSON:opencode-go}
        base_url: ${OPENCODE_GO_BASE_URL}
    enabled: true

  # deepseek_flash_cmd（opencode 禁用期顶上 DS 槽位；Command Code chat
  # completions，09-05 实测 GET /models 与 flash 均 200）。
  deepseek_flash_cmd:
    provider: openai_compatible
    model: deepseek/deepseek-v4-flash
    api_key: ${COMMANDCODE_API_KEY}
    base_url: ${COMMANDCODE_BASE_URL}
    enabled: true
    # 2026-09-07：显式封顶（客户端默认 600s 是隐式的，且 max_retries 已归 0）。
    timeout: 600

  # 小米 MiMo v2.5-pro（token-plan 端点）- 视觉专用，识图链第一优先
  # （owner 2026-09-02 新增；key 存于 llm.env MIMO_TOKEN_PLAN_API_KEY，值不入 git）
  mimo-token-plan:
    provider: openai_compatible
    model: mimo-v2.5
    api_key: ${MIMO_TOKEN_PLAN_API_KEY}
    base_url: "https://token-plan-cn.xiaomimimo.com/v1"
    enabled: true

  # 小米 MiMo n-v2.5 - 识图链末位兜底（owner 2026-08-28 重排；原生识图，OpenAI 兼容）
  # 用法参考 https://mimo.mi.com/docs/zh-CN/quick-start/usage-guide/multimodal-understanding/image-understanding
  mimo:
    provider: openai_compatible
    model: mimo-v2.5
    api_key: ${MIMO_API_KEY}
    base_url: ${MIMO_BASE_URL}
    enabled: true

  # 智谱 GLM-4.6V-Flash（免费额度）- 识图链第二优先（OpenAI 兼容）
  # 官方 key 2026-08-28 起存于 llm.env GLM_VISION_API_KEY（旧 key 已 401 失效）
  # 2026-08-31 曾禁用（GLM 额度耗尽）；owner 2026-09-02 重新启用
  glm-vision:
    provider: openai_compatible
    model: glm-4.6v-flash
    api_key: ${GLM_VISION_API_KEY}
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    timeout: 90
    enabled: true

  # 自定义 - 任意 OpenAI 兼容端点 (Ollama/vLLM/硅基流动等)
  custom:
    provider: openai_compatible
    model: llama-3
    api_key: ${CUSTOM_LLM_API_KEY}
    base_url: ${CUSTOM_LLM_BASE_URL}
    enabled: false

  # 视觉模型 (图片→结构化数据提取)
  vision:
    provider: openai_compatible
    model: Qwen/Qwen3-VL-30B-A3B-Instruct
    api_key: ${SILICONFLOW_API_KEY}
    base_url: ${SILICONFLOW_BASE_URL}
    enabled: true

  # —— harness 型连接（无头 harness 登记与总开关；分层管理
  #    docs/design/llm-pool-layering.md，owner 2026-09-06 拍板）。别名=全局
  #    唯一，消费者（问询链 conn_ref / 评审链 profile）经别名引用；auth 留在
  #    各 harness 家（auth_note 纯文档）；不进 backend plan（config_loader
  #    豁免）；池 enabled=false ⇒ 所有消费链序跳过（fail-visible），钉腿=拒绝 ——
  commandcode-pro:
    type: harness
    harness: commandcode
    model: deepseek/deepseek-v4-pro
    auth_note: "cmd login 账号会话"
    enabled: true
  commandcode-flash:
    type: harness
    harness: commandcode
    model: deepseek/deepseek-v4-flash
    auth_note: "cmd login 账号会话"
    enabled: true
  zcode:
    type: harness
    harness: zcode
    model: zhipu/glm-5.3-flash
    auth_note: "llm.env GLM_API_KEY→ZHIPU_API_KEY + ~/.zcode/cli/config.json 单旋钮；owner 2026-09-06 拍板锚定 flash=测试腿 B（真实问询走有头手动，无头链测试为主）"
    enabled: true
  claude-cc:
    type: harness
    harness: claude
    model: glm-5.3
    auth_note: "CC 接线自管（ambient，glm-5.3 实跑实证）；模型经 launcher --model 逐次指定；凭据不在本仓"
    enabled: true
  claude-cc-flash:
    type: harness
    harness: claude
    model: glm-5.3-flash
    auth_note: "同 claude-cc，备用测试腿 C 档位"
    enabled: true
  codex-opencode:
    type: harness
    harness: codex
    model: deepseek-v4-pro
    auth_note: "consult-agent/.codex + llm.env OPENCODE_GO_*（模型实际由该 home config 决定）"
    enabled: true    # owner 2026-09-07 拍板翻回（休眠缘由即 429 限额，渠道复测探针 200；按声明序插回生产问询链第二位）

# 消费方候选顺序（家规规则 6：会变的选择进配置不写死代码）。
# t0 = 难题质量锚（先用 glm5.3）；t1 = 简单任务吞吐（先用 glm5.3-flash）。
# 名字必须是 models 下的条目；段缺失/非法时消费方回退各自硬编码缺省序。
# cognition = thesis/central-idea 提取（owner 2026-09-04：首位换 glm53_flash，
# 替换 08-30 晚的 glm53 先行裁决；更早助手引入的 qwen-first 未经同意已废。
# 机制调查见 ~/fin-data/handoffs/20260830-cognition-empty-collapse-handoff.md。
# owner 2026-09-05 设计：DS 槽位 = opencode ds flash → cmd ds flash 两节点，
# 每节点 enabled 独立开关，声明序固定——opencode 禁用时链自动落到 cmd 节点，
# 恢复翻回 enabled: true 即回第一位，无其他改动）。
# owner 2026-09-07：汇总类帖在 coding 端点触发生成内容过滤（1301 实证，
# 标准端点不受限），认知链按 column 子串命中跳过 coding 端点后端；
# 未命中类型 fail-open 走完整链。实证样本扩充时在此追加类目。
routing:
  content_filter_skip:
    columns: ["每日热点"]
    skip_backends: [glm53_flash]

priorities:
  t0: [glm53, deepseek, qwen]
  t1: [glm53_flash, deepseek, qwen]
  # 2026-09-07 owner：cognition 深读链 DS 兜底只用 commandcode 一家，
  # opencode 移出该档（模型条目保留，其他档不受影响）。
  cognition: [glm53_flash, deepseek_flash_cmd, qwen]

# 识图 fallback 链（owner 2026-08-28 拍板重排：glm5.3-flash → GLM-4.6V-Flash 免费 → 硅基流动 → mimo；
# 2026-09-02 owner 再改：mimo-token-plan（mimo-v2.5-pro）置首、GLM-4.6V 恢复启用）
# 条目必须是 models 下的 key：缺失/禁用/未解析 ${}/熔断打开的条目跳过，保序去重；
# 段或 chain 键缺失/非法时代码回退现状缺省序（mimo → glm-vision → vision，配置缺失=行为不变）。
# glm53_flash 走 coding 端点已探针验证收图（2026-08-28）；全部失败落 OCR 终兜底。
vision:
  chain: [mimo-token-plan, glm53_flash, glm-vision, vision, mimo]

# 交叉验证设置
cross_validation:
  # 最少需要几个模型达成一致
  min_agreement: 2
  # 达成一致时的置信度 boost
  agreement_boost: 0.1
